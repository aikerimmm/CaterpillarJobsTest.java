pipeline {
    agent any

    stages {
        stage('Checkout') {
            steps {
                checkout scm
            }
        }

        stage('Run Tests') {
            steps {
                sh './gradlew clean test'
            }
        }

        stage('Allure Report') {
            steps {
                allure([
                        includeProperties: false,
                        jdk: '',
                        results: [[path: 'build/allure-results']]
                ])
            }
        }
    }

    post {
        success {
            sh '''
                curl -s -X POST https://api.telegram.org/bot<8834154040:AAEGVavg673aqizg9VcYCXfHwmCDMmbkCcg>/sendMessage \
                -d chat_id=<-1003571566536> \
                -d text="✅ Build #${BUILD_NUMBER} PASSED%0A Job: ${JOB_NAME}%0A URL: ${BUILD_URL}"
            '''
        }
        failure {
            sh '''
                curl -s -X POST https://api.telegram.org/bot<8834154040:AAEGVavg673aqizg9VcYCXfHwmCDMmbkCcg>/sendMessage \
                -d chat_id=<-1003571566536> \
                -d text="❌ Build #${BUILD_NUMBER} FAILED%0A Job: ${JOB_NAME}%0A URL: ${BUILD_URL}"
            '''
        }
    }
}